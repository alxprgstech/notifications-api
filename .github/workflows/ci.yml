name: Verify foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: dotnet restore Notify.sln --locked-mode
      - run: dotnet list Notify.sln package --vulnerable --include-transitive
      - run: dotnet build Notify.sln --no-restore -c Release
      - run: dotnet test Notify.sln --no-build -c Release --logger trx
      - run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: python -m pip install -c packages/python-sdk/requirements-test-lock.txt './packages/python-sdk[mcp,agent]' build cryptography
      - run: python -m unittest discover -s packages/python-sdk/tests -v
      - run: python scripts/sdk_smoke.py
      - run: python scripts/chatgpt_smoke.py --fixture-audio
      - run: npx playwright install --with-deps chromium && npm run test:ui
        working-directory: web
      - run: python -m build packages/python-sdk --outdir artifacts/sdk
      - name: Build Notify server image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t alxprgs-notify:local .
      - name: Package the verified server image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          image_dir="$(mktemp -d)"
          trap 'rm -rf -- "$image_dir"' EXIT
          docker image save -o "$image_dir/images.tar" alxprgs-notify:local
          python - "$image_dir" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          import tarfile

          directory = Path(sys.argv[1])
          image = directory / "images.tar"
          with tarfile.open(image) as archive:
              records = json.load(archive.extractfile("manifest.json"))
              if len(records) != 1:
                  raise SystemExit("Expected one app image")
              config = archive.extractfile(records[0]["Config"]).read()
          metadata = json.loads(config)
          assert metadata["os"] == "linux" and metadata["architecture"] == "amd64"
          assert metadata["config"]["Labels"]["org.opencontainers.image.revision"] == sys.argv[2]
          with image.open("rb") as source:
              digest = hashlib.file_digest(source, "sha256").hexdigest()
          (directory / "manifest.json").write_text(json.dumps({
              "format": 1,
              "sha": sys.argv[2],
              "image": "sha256:" + hashlib.sha256(config).hexdigest(),
              "files": {"images.tar": digest},
          }, indent=2) + "\n")
          PY
          tar -czf notify-server.tar.gz -C "$image_dir" manifest.json images.tar
      - name: Save the immutable Notify server transport
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: notify-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: notify-server.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: notify-sdk-and-tests
          path: |
            artifacts/sdk/*
            tests/**/TestResults/*.trx
          retention-days: 7
