name: Verify foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: dotnet restore Notify.sln --locked-mode
      - run: dotnet test Notify.sln --no-restore -c Release --logger trx
      - run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - run: python -m pip install -c packages/python-sdk/requirements-test-lock.txt './packages/python-sdk[mcp,agent]' build cryptography
      - run: python -m unittest discover -s packages/python-sdk/tests -v
      - run: python scripts/sdk_smoke.py
      - run: python scripts/chatgpt_smoke.py --fixture-audio
      - run: npx playwright install --with-deps chromium && npm run test:ui
        working-directory: web
      - run: python -m build packages/python-sdk --outdir artifacts/sdk
      - run: docker build -t alxprgs-notify:local .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: notify-sdk-and-tests
          path: |
            artifacts/sdk/*
            tests/**/TestResults/*.trx
          retention-days: 7
