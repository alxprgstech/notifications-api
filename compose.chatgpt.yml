# Apply after compose.yml and compose.home.yml.
services:
  chatgpt:
    build:
      context: .
      dockerfile: src/Notify.ChatGpt/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${CHATGPT_MEMORY_LIMIT:-256m}
    cpus: '${CHATGPT_CPU_LIMIT:-0.5}'
    env_file: ${CHATGPT_ENV_FILE:?Set the private OAuth adapter env file}
    environment:
      ChatGpt__PublicUrl: https://${CHATGPT_DOMAIN:?Set the OAuth adapter hostname}
      ChatGpt__TrustedProxy: 172.30.89.2
      ChatGpt__DataPath: /state
      ChatGpt__NotifyUrl: http://notify:8080
      ChatGpt__SileroUrl: http://silero:8080
    volumes:
      - chatgpt_data:/state
    tmpfs: ['/tmp:size=16m,mode=1777']
    networks:
      default: {}
      chatgpt_ingress:
        ipv4_address: 172.30.89.3
        aliases: [notify-chatgpt-ingress]
      speech: {}
    depends_on: [notify]
  silero:
    build: ./deploy/silero
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: ${SILERO_MEMORY_LIMIT:-1024m}
    cpus: '${SILERO_CPU_LIMIT:-1.0}'
    tmpfs: ['/tmp:size=16m,mode=1777']
    volumes:
      - type: bind
        source: ${SILERO_MODEL_FILE:?Set the path to the verified Silero model}
        target: /model/v5_6_ru.pt
        read_only: true
        bind:
          create_host_path: false
    networks: [speech]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 6
  caddy:
    environment:
      CHATGPT_DOMAIN: ${CHATGPT_DOMAIN:?Set the OAuth adapter hostname}
    volumes:
      - ./deploy/chatgpt.caddy:/etc/caddy/notify-chatgpt/chatgpt.caddy:ro
    networks:
      default: {}
      chatgpt_ingress:
        ipv4_address: 172.30.89.2

networks:
  chatgpt_ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.89.0/28
  speech:
    internal: true

volumes:
  chatgpt_data:
