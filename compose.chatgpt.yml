# Apply after compose.yml and compose.home.yml.
services:
  notify:
    networks: [default, speech]
  silero:
    build: ./deploy/silero
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: ${SILERO_MEMORY_LIMIT:-1024m}
    cpus: '${SILERO_CPU_LIMIT:-1.0}'
    tmpfs: ['/tmp:size=16m,mode=1777']
    volumes:
      - type: bind
        source: ${SILERO_MODEL_FILE:?Set the path to the verified Silero model}
        target: /model/v5_6_ru.pt
        read_only: true
        bind:
          create_host_path: false
    networks: [speech]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 6

networks:
  speech:
    internal: true
