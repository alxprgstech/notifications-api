# Install only this new vhost; do not replace SSO's nginx configuration.
# TLS certificate must exist before enabling the HTTPS block.
server {
    listen 80;
    server_name notify.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://notify.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name notify.example.com;
    ssl_certificate /etc/letsencrypt/live/notify.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notify.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Callback query strings contain single-use credentials; never log them.
    location /auth/ { access_log off; proxy_pass http://127.0.0.1:8085; proxy_set_header Host $host; }
    location /signin-oidc { access_log off; proxy_pass http://127.0.0.1:8085; proxy_set_header Host $host; }
    location = /android/oauth2redirect { access_log off; proxy_pass http://127.0.0.1:8085; proxy_set_header Host $host; }
    location ^~ /api/v1/device-enrollments/ { access_log off; proxy_pass http://127.0.0.1:8085; proxy_set_header Host $host; }
    location /mcp {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
    }
    location = /api/v1/audio/uploads {
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
    }
    location ^~ /api/v1/agents/calls/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /api/v1/calls/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /api/v1/agents/connect {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { proxy_pass http://127.0.0.1:8085; proxy_set_header Host $host; }
}
